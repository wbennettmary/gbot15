{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Afraid (FreeDNS) Management</h2>

    <div class="row">
        <!-- Configuration Card -->
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">FreeDNS Configuration</h5>
                </div>
                <div class="card-body">
                    <form id="configForm">
                        <div class="mb-3">
                            <label for="afraidUsername" class="form-label">Username</label>
                            <input type="text" class="form-control" id="afraidUsername" required>
                        </div>
                        <div class="mb-3">
                            <label for="afraidPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="afraidPassword" placeholder="Enter new password to change" autocomplete="new-password">
                            <small class="text-muted" id="passwordHint" style="display:none">Password is saved. Leave blank to keep current password.</small>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Configuration</button>
                    </form>
                    <div id="configAlert" class="mt-3"></div>
                </div>
            </div>
        </div>

        <!-- Subdomain Generation Card -->
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-header bg-success text-white">
                    <h5 class="card-title mb-0">Add a new subdomain (CNAME)</h5>
                </div>
                <div class="card-body">
                    <form id="createSubdomainForm">
                        <div class="mb-3">
                            <label class="form-label">Type</label>
                            <input type="text" class="form-control" value="CNAME" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subdomain</label>
                            <input type="text" class="form-control" value="(Will be generated automatically)" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="domainSelect" class="form-label">Domain</label>
                            <select class="form-select" id="domainSelect" required>
                                <option value="">Loading domains...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="destinationInput" class="form-label">Destination (Cloudflare domain)</label>
                            <input type="text" class="form-control" id="destinationInput" placeholder="e.g. altomirevia.fun" required>
                        </div>
                        <div class="mb-3">
                            <label for="ttlInput" class="form-label">TTL (seconds)</label>
                            <input type="number" class="form-control" id="ttlInput" value="300" required>
                        </div>
                        <button type="submit" class="btn btn-success" id="btnCreateSubdomain">Create & Link Subdomain</button>
                    </form>
                    <div id="createAlert" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Domains Management Card -->
    <div class="card mb-4">
        <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">Managed Afraid Domains</h5>
            <button class="btn btn-sm btn-light" id="btnFetchDomains">Fetch from FreeDNS</button>
        </div>
        <div class="card-body">
            <form id="addDomainForm" class="mb-4">
                <div class="input-group">
                    <input type="text" class="form-control" id="newDomainInput" placeholder="Enter domain name (e.g. artitech.com)" required>
                    <button class="btn btn-primary" type="submit">Add Domain Manually</button>
                </div>
            </form>
            
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Domain Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="domainsTableBody">
                    <tr><td colspan="2" class="text-center">Loading domains...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    loadConfig();
    loadDomains();

    document.getElementById('configForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('afraidUsername').value;
        const passwordField = document.getElementById('afraidPassword');
        const password = passwordField.value;
        
        // If password field is blank and we already have a config, skip password update
        // Send a special marker so the backend knows to keep the old password
        const payload = { username };
        if (password && password.trim() !== '') {
            payload.password = password;
        } else if (!passwordField.dataset.configured) {
            showAlert('configAlert', 'Please enter a password', 'warning');
            return;
        }
        
        try {
            const res = await fetch('/api/afraid/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            showAlert('configAlert', data.success ? 'Configuration saved!' : (data.error || 'Error'), data.success ? 'success' : 'danger');
            if (data.success) {
                passwordField.value = '';
                passwordField.dataset.configured = 'true';
                document.getElementById('passwordHint').style.display = 'block';
            }
        } catch (err) {
            showAlert('configAlert', 'Error saving configuration', 'danger');
        }
    });

    document.getElementById('addDomainForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const domain_name = document.getElementById('newDomainInput').value;
        
        try {
            const res = await fetch('/api/afraid/domains', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({domain_name})
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('newDomainInput').value = '';
                loadDomains();
            } else {
                alert('Error adding domain: ' + data.error);
            }
        } catch (err) {
            alert('Error adding domain');
        }
    });

    document.getElementById('btnFetchDomains').addEventListener('click', async () => {
        const btn = document.getElementById('btnFetchDomains');
        btn.disabled = true;
        btn.innerHTML = 'Fetching...';
        
        try {
            const res = await fetch('/api/afraid/fetch-domains', {method: 'POST'});
            const data = await res.json();
            if (data.success) {
                alert(`Successfully fetched and added ${data.added} domains from FreeDNS.`);
                loadDomains();
            } else {
                alert('Error fetching domains: ' + data.error);
            }
        } catch (err) {
            alert('Error fetching domains');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Fetch from FreeDNS';
        }
    });

    document.getElementById('createSubdomainForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnCreateSubdomain');
        btn.disabled = true;
        btn.innerHTML = 'Creating...';
        
        const base_domain = document.getElementById('domainSelect').value;
        const destination = document.getElementById('destinationInput').value;
        const ttl = document.getElementById('ttlInput').value;
        
        try {
            const res = await fetch('/api/afraid/create-subdomain', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({base_domain, destination, ttl})
            });
            const data = await res.json();
            if (data.success) {
                showAlert('createAlert', `Success! Subdomain created: ${data.subdomain}`, 'success');
            } else {
                showAlert('createAlert', 'Error: ' + data.error, 'danger');
            }
        } catch (err) {
            showAlert('createAlert', 'Request failed', 'danger');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Create & Link Subdomain';
        }
    });
});

async function loadConfig() {
    try {
        const res = await fetch('/api/afraid/config');
        const data = await res.json();
        if (data.success) {
            document.getElementById('afraidUsername').value = data.username || '';
            const passwordField = document.getElementById('afraidPassword');
            if (data.is_configured) {
                // Don't pre-fill the password – just show the hint
                passwordField.value = '';
                passwordField.dataset.configured = 'true';
                document.getElementById('passwordHint').style.display = 'block';
            }
        }
    } catch (err) {
        console.error('Error loading config', err);
    }
}

async function loadDomains() {
    try {
        const res = await fetch('/api/afraid/domains');
        const data = await res.json();
        const tbody = document.getElementById('domainsTableBody');
        const select = document.getElementById('domainSelect');
        
        tbody.innerHTML = '';
        select.innerHTML = '<option value="">Select a domain...</option>';
        
        if (data.success && data.domains.length > 0) {
            data.domains.forEach(d => {
                // Add to table
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${d.domain_name}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="deleteDomain(${d.id})">Delete</button></td>
                `;
                tbody.appendChild(tr);
                
                // Add to select
                const opt = document.createElement('option');
                opt.value = d.domain_name;
                opt.textContent = d.domain_name;
                select.appendChild(opt);
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="2" class="text-center">No domains found</td></tr>';
        }
    } catch (err) {
        console.error('Error loading domains', err);
    }
}

async function deleteDomain(id) {
    if (!confirm('Are you sure you want to delete this domain?')) return;
    try {
        const res = await fetch(`/api/afraid/domains/${id}`, {method: 'DELETE'});
        const data = await res.json();
        if (data.success) {
            loadDomains();
        } else {
            alert('Error deleting domain: ' + data.error);
        }
    } catch (err) {
        alert('Error deleting domain');
    }
}

function showAlert(elementId, message, type) {
    const el = document.getElementById(elementId);
    el.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show">
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>`;
}
</script>
{% endblock %}
